# Lint, type-check, test, build and smoke-test on every PR into main and every push
# to main.
#
# Runners: a private repository runs on Vericto's self-hosted spot runners
# (CI_RUNS_ON overrides them, as in vericto-fmw); a public one always runs on
# GitHub-hosted runners (CI_RUNS_ON_PUBLIC, default "ubuntu-latest"), so a pull
# request from a fork can never reach self-hosted hardware, even if CI_RUNS_ON is
# unset or still points at it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check and test (Node ${{ matrix.node }})
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The dev tooling (vitest, eslint, better-sqlite3 13) needs Node 22+.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # npm test with V8 coverage; fails under 80% (vitest.config.ts). Includes
      # test/langchain.test.ts (pinned @langchain/classic, @langchain/core, typeorm).
      - run: npm run test:coverage
      - run: npm run build
      # The README's and the LangChain.js guide's TypeScript examples, type-checked and
      # run against a local Runtime API stand-in (scripts/docs-stub.mjs): no key, no network.
      - run: npm run docs:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '24'
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Built package on Node ${{ matrix.node }}
    needs: check
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The runtime promise is Node 18+: the built ESM and CJS, no dev dependencies.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: node scripts/smoke.mjs

  docs:
    # The framework guides (docs/frameworks/*.md): each TypeScript example is
    # type-checked and run against the Runtime API stand-in, with the framework
    # versions pinned in docs/frameworks/package.json and real PostgreSQL and MySQL.
    name: Framework guide examples
    needs: check
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: docs
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: docs
          MYSQL_DATABASE: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdocs" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Throwaway service containers of this job; not secrets.
      DATABASE_URL: postgres://postgres:docs@127.0.0.1:5432/app
      MYSQL_URL: mysql://root:docs@127.0.0.1:3306/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/frameworks/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: docs/frameworks
      - run: node scripts/check-docs-examples.mjs frameworks

  pack:
    name: Package contents
    needs: check
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Only dist and the docs are published
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            const bad = files.filter((p) => !/^(dist\/|README\.md$|CHANGELOG\.md$|SECURITY\.md$|LICENSE$|NOTICE$|package\.json$)/.test(p));
            console.log(files.join("\n"));
            if (bad.length) { console.error("unexpected files:", bad); process.exit(1); }
          ' "$RUNNER_TEMP/pack.json"
