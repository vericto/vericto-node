# Publish to npm when a version tag (v0.2.1, ...) is pushed.
#
# npm trusted publishing (OIDC) with provenance: no npm token is stored. The trusted
# publisher is configured on npmjs.com (package @vericto/sdk → Settings → Trusted
# publishing): organization `vericto`, repository `vericto-node`, workflow
# `release.yml`, environment `npm`. The `npm` environment has a required reviewer.
#
# GitHub-hosted runner on purpose: npm provenance is generated only on cloud-hosted
# runners.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@vericto/sdk
    permissions:
      contents: read
      id-token: write   # OIDC for trusted publishing and the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1+.
      - run: npm install -g npm@11.21.0
      - name: The tag matches the package version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build && npm run smoke
      - name: Publish with provenance
        run: npm publish --access public --provenance

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md for what changed."
